services:
  postgres:
    image: postgres:16-alpine
    container_name: linkvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-link_vault_db}
      POSTGRES_USER: ${POSTGRES_USER:-linkvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkvault123}
    ports:
      - "5432:5432"
    volumes:
      - linkvault_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linkvault} -d ${POSTGRES_DB:-link_vault_db}"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - linkvault-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: linkvault-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@linkvault.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - linkvault-network

  server:
    build:
      context: ./server
    container_name: linkvault-server
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-link_vault_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-linkvault}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-linkvault123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-true}

      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-link-vault-api}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be set in .env}
      APP_JWT_EXPIRATION_MINUTES: ${APP_JWT_EXPIRATION_MINUTES:-120}
      APP_SEED_DEMO_DATA: ${APP_SEED_DEMO_DATA:-false}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-link-vault}
      CLOUDINARY_USE_SECURE_URL: ${CLOUDINARY_USE_SECURE_URL:-true}
      CLOUDINARY_MAX_FILE_SIZE_MB: ${CLOUDINARY_MAX_FILE_SIZE_MB:-20}
      CLOUDINARY_ALLOWED_FORMATS: ${CLOUDINARY_ALLOWED_FORMATS:-jpg,jpeg,png,webp,gif,svg,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,md,csv,json,xml,yaml,yml,log,java,kt,py,ts,tsx,js,jsx,html,css,scss,sql,sh,ps1,c,cpp,h,hpp,cs,go,rs,php,rb,swift,dart,zip,rar,7z,mp3,wav,mp4,webm,mov}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - linkvault-network

  client:
    build:
      context: ./client
    container_name: linkvault-client
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - server
    networks:
      - linkvault-network

volumes:
  linkvault_pgdata:

networks:
  linkvault-network:
    driver: bridge

