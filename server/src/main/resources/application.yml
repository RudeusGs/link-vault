spring:
  application:
    name: LinkVaultApi
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/link_vault_db}
    username: ${SPRING_DATASOURCE_USERNAME:linkvault}
    password: ${SPRING_DATASOURCE_PASSWORD:linkvault123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:linkvault}
    password: ${SPRING_RABBITMQ_PASSWORD:linkvaultrabbit123}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      retry:
        enabled: true
        max-attempts: ${APP_RABBITMQ_RETRY_MAX_ATTEMPTS:3}
        initial-interval: ${APP_RABBITMQ_RETRY_INITIAL_INTERVAL:1000}ms
        multiplier: ${APP_RABBITMQ_RETRY_MULTIPLIER:2.0}
        max-interval: ${APP_RABBITMQ_RETRY_MAX_INTERVAL:10000}ms
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: ${APP_RABBITMQ_RETRY_MAX_ATTEMPTS:3}
          initial-interval: ${APP_RABBITMQ_RETRY_INITIAL_INTERVAL:1000}ms
          multiplier: ${APP_RABBITMQ_RETRY_MULTIPLIER:2.0}
          max-interval: ${APP_RABBITMQ_RETRY_MAX_INTERVAL:10000}ms
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080
  forward-headers-strategy: framework

app:
  seed-demo-data: ${APP_SEED_DEMO_DATA:false}
  jwt:
    issuer: ${APP_JWT_ISSUER:link-vault-api}
    secret: ${APP_JWT_SECRET:${random.uuid}${random.uuid}}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  redis:
    enabled: ${APP_REDIS_ENABLED:true}
    key-prefix: ${APP_REDIS_KEY_PREFIX:linkvault}
    cache:
      dashboard-summary-ttl: ${APP_REDIS_CACHE_DASHBOARD_SUMMARY_TTL:5m}
      vault-list-ttl: ${APP_REDIS_CACHE_VAULT_LIST_TTL:10m}
      folder-tree-ttl: ${APP_REDIS_CACHE_FOLDER_TREE_TTL:10m}
      resource-list-ttl: ${APP_REDIS_CACHE_RESOURCE_LIST_TTL:3m}
      resource-detail-ttl: ${APP_REDIS_CACHE_RESOURCE_DETAIL_TTL:5m}
      tag-list-ttl: ${APP_REDIS_CACHE_TAG_LIST_TTL:10m}
      workspace-usage-ttl: ${APP_REDIS_CACHE_WORKSPACE_USAGE_TTL:1m}
      link-preview-ttl: ${APP_REDIS_CACHE_LINK_PREVIEW_TTL:30m}
    rate-limit:
      enabled: ${APP_REDIS_RATE_LIMIT_ENABLED:true}
      auth-capacity: ${APP_REDIS_RATE_LIMIT_AUTH_CAPACITY:10}
      auth-window: ${APP_REDIS_RATE_LIMIT_AUTH_WINDOW:1m}
      upload-capacity: ${APP_REDIS_RATE_LIMIT_UPLOAD_CAPACITY:20}
      upload-window: ${APP_REDIS_RATE_LIMIT_UPLOAD_WINDOW:1m}
      preview-capacity: ${APP_REDIS_RATE_LIMIT_PREVIEW_CAPACITY:50}
      preview-window: ${APP_REDIS_RATE_LIMIT_PREVIEW_WINDOW:1m}
  rabbitmq:
    enabled: ${APP_RABBITMQ_ENABLED:true}
    exchange: ${APP_RABBITMQ_EXCHANGE:linkvault.events.exchange}
    audit-queue: ${APP_RABBITMQ_AUDIT_QUEUE:linkvault.audit.queue}
    preview-queue: ${APP_RABBITMQ_PREVIEW_QUEUE:linkvault.preview.queue}
    notification-queue: ${APP_RABBITMQ_NOTIFICATION_QUEUE:linkvault.notification.queue}
    cleanup-queue: ${APP_RABBITMQ_CLEANUP_QUEUE:linkvault.cleanup.queue}
    audit-routing-key: ${APP_RABBITMQ_AUDIT_ROUTING_KEY:linkvault.audit.record}
    preview-routing-key: ${APP_RABBITMQ_PREVIEW_ROUTING_KEY:linkvault.resource.preview.requested}
    notification-routing-key: ${APP_RABBITMQ_NOTIFICATION_ROUTING_KEY:linkvault.notification.requested}
    cleanup-routing-key: ${APP_RABBITMQ_CLEANUP_ROUTING_KEY:linkvault.cleanup.requested}
    retry:
      max-attempts: ${APP_RABBITMQ_RETRY_MAX_ATTEMPTS:3}
      initial-interval: ${APP_RABBITMQ_RETRY_INITIAL_INTERVAL:1000}
      multiplier: ${APP_RABBITMQ_RETRY_MULTIPLIER:2.0}
      max-interval: ${APP_RABBITMQ_RETRY_MAX_INTERVAL:10000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:link-vault}
  use-secure-url: ${CLOUDINARY_USE_SECURE_URL:true}
  max-file-size-mb: ${CLOUDINARY_MAX_FILE_SIZE_MB:20}
  allowed-formats: ${CLOUDINARY_ALLOWED_FORMATS:jpg,jpeg,png,webp,gif,svg,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,md,csv,json,xml,yaml,yml,log,java,kt,py,ts,tsx,js,jsx,html,css,scss,sql,sh,ps1,c,cpp,h,hpp,cs,go,rs,php,rb,swift,dart,zip,rar,7z,mp3,wav,mp4,webm,mov}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always


